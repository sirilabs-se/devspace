# Local services for development and tests. Not used in production.
name: saas-project

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saas -d saas']
      interval: 2s
      timeout: 5s
      retries: 30

  # Mailpit: a local inbox. The app sends email to it over SMTP and every
  # message appears at http://localhost:8025. Nothing leaves this machine.
  mail:
    image: axllent/mailpit:v1.29
    ports:
      - '127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAIL_UI_PORT:-8025}:8025'

volumes:
  db-data:
