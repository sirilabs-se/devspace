<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Test YouTube</title>
		<style>
			body {
				margin: 0;
				font-family: sans-serif;
			}
			#movie_player {
				position: relative;
				width: min(640px, 100vw);
				height: 360px;
				background: #345;
				overflow: hidden;
			}
			.ytp-chrome-bottom {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 40px;
				background: #222;
				z-index: 59;
			}
			.ytp-caption-window-container {
				position: absolute;
				left: 20px;
				bottom: 60px;
				z-index: 10;
				color: #fff;
			}
			body.theater #movie_player {
				width: min(900px, 100vw);
			}
			#movie_player:fullscreen {
				width: 100vw;
				height: 100vh;
			}
			ytd-miniplayer.mini {
				position: fixed;
				right: 16px;
				bottom: 16px;
				display: block;
				width: 400px;
				height: 225px;
			}
			ytd-miniplayer.mini #movie_player {
				width: 100%;
				height: 100%;
			}
			.ytp-error {
				position: absolute;
				inset: 0;
				z-index: 44;
				background: #000;
				color: #fff;
			}
			.ytp-play-button {
				position: absolute;
				left: 10px;
				top: 5px;
			}
			.ytp-chrome-controls {
				position: absolute;
				right: 10px;
				top: 0;
				height: 40px;
				display: flex;
			}
			.ytp-right-controls,
			.ytp-right-controls-left {
				display: flex;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="tools">
			<button id="theater" onclick="document.body.classList.toggle('theater')">Theater</button>
			<button id="fullscreen" onclick="document.getElementById('movie_player').requestFullscreen()">
				Fullscreen
			</button>
			<button id="error" onclick="window.__showError()">Error screen</button>
			<button id="pip" onclick="window.__tryPip()">Picture in picture</button>
		</div>
		<ytd-app>
			<div id="slot"></div>
		</ytd-app>
		<script>
			window.__playClicks = 0;
			const PLAYER = `<ytd-watch-flexy><div id="cinematics">ambient glow</div><div id="player"><div id="movie_player" class="html5-video-player">
				<div class="html5-video-container"><video></video></div>
				<div class="ytp-chrome-bottom">
					<button class="ytp-play-button" id="play">Play</button>
					CONTROLS
				</div>
				<div class="ytp-caption-window-container">Caption text</div>
			</div></div></ytd-watch-flexy>`;
			// A stand-in for YouTube's player API, recording what it is asked for.
			window.__levels = ['hd1080', 'hd720', 'large', 'medium', 'small', 'tiny', 'auto'];
			window.__qualityCalls = [];
			// A clock for the fake player: one second of position per second of playing.
			setInterval(() => {
				const video = document.querySelector('#movie_player video');
				if (video && !video.paused) {
					const next = (window.__position ?? 0) + video.playbackRate;
					window.__position = Math.min(next, window.__duration ?? 212);
				}
			}, 1000);
			window.__playbackCalls = [];
			window.__keys = [];
			document.addEventListener('keydown', (event) => window.__keys.push(event.key));
			window.__failQuality ??= false;
			window.__noApi ??= false;
			window.__noPlayer ??= false;
			window.__noControlBar ??= false;
			function attachPlayerApi() {
				const player = document.getElementById('movie_player');
				if (!player || window.__noApi) return;
				const heights = {
					tiny: 144,
					small: 240,
					medium: 360,
					large: 480,
					hd720: 720,
					hd1080: 1080
				};
				player.getVideoData = () => {
					// Like YouTube, the player keeps its video when the page moves off the watch URL.
					const fromUrl = new URLSearchParams(location.search).get('v');
					if (fromUrl) window.__lastVideoId = fromUrl;
					const id = fromUrl || window.__lastVideoId || '';
					return {
						video_id: id,
						title: window.__title ?? 'Test video ' + id,
						author: window.__author ?? 'Test channel',
						isLive: window.__isLive === true
					};
				};
				player.getDuration = () => window.__duration ?? 212;
				// A player volume of its own, announced as a real one is.
				window.__volume ??= 100;
				window.__muted ??= false;
				player.getVolume = () => window.__volume;
				player.isMuted = () => window.__muted;
				player.setVolume = (level) => {
					window.__volume = level;
					video.dispatchEvent(new Event('volumechange'));
				};
				player.mute = () => {
					window.__muted = true;
					video.dispatchEvent(new Event('volumechange'));
				};
				player.unMute = () => {
					window.__muted = false;
					video.dispatchEvent(new Event('volumechange'));
				};
				window.__seekCalls = [];
				player.seekTo = (seconds) => {
					window.__seekCalls.push(seconds);
					window.__position = seconds;
					player.querySelector('video').dispatchEvent(new Event('seeked'));
				};
				player.getCurrentTime = () => window.__position ?? 0;
				player.getAvailableQualityLevels = () => window.__levels;
				// YouTube's own state can trail the video element by a moment; window.__stateLagMs imitates that.
				let shown = null;
				const video = player.querySelector('video');
				// window.__buffering imitates a video that has run out of data.
				Object.defineProperty(video, 'readyState', { get: () => (window.__buffering ? 1 : 4) });
				// A stream-backed video ignores playbackRate, so the rate is kept here and announced as a real one is.
				let rate = 1;
				Object.defineProperty(video, 'playbackRate', {
					get: () => rate,
					set: (value) => {
						rate = value;
						video.dispatchEvent(new Event('ratechange'));
					}
				});
				for (const name of ['play', 'pause']) {
					video.addEventListener(name, () => {
						const actual = video.paused ? 2 : 1;
						if (window.__stateLagMs) setTimeout(() => (shown = actual), window.__stateLagMs);
						else shown = actual;
					});
				}
				player.getPlayerState = () => shown ?? (video.paused ? 2 : 1);
				player.playVideo = () => {
					window.__playbackCalls.push('play');
					player.querySelector('video').play();
				};
				player.pauseVideo = () => {
					window.__playbackCalls.push('pause');
					player.querySelector('video').pause();
				};
				player.setPlaybackQualityRange = (min, max) => {
					window.__qualityCalls.push([min, max ?? null]);
					if (window.__failQuality) throw new Error('player refused');
					const quality = min === 'auto' ? 0 : heights[min];
					localStorage.setItem(
						'yt-player-quality',
						JSON.stringify({ data: JSON.stringify({ quality, previousQuality: 0 }), creation: 1 })
					);
				};
			}
			function render() {
				const controls = window.__noControlBar
					? ''
					: '<div class="ytp-chrome-controls"><div class="ytp-right-controls"><div class="ytp-right-controls-left"><button class="ytp-button" id="cc">CC</button></div></div></div>';
				const onWatch = location.pathname === '/watch';
				document.getElementById('slot').innerHTML = onWatch
					? window.__noPlayer
						? '<ytd-watch-flexy></ytd-watch-flexy>'
						: PLAYER.replace('CONTROLS', controls)
					: '<p>Home page</p>';
				attachPlayerApi();
				document.getElementById('play')?.addEventListener('click', () => window.__playClicks++);
			}
			// Mimics YouTube's in-page navigation: the URL changes and an event is fired, with no reload.
			// Gives the player a real picture, so picture-in-picture can be tried for real.
			window.__startVideo = async () => {
				const canvas = document.createElement('canvas');
				canvas.width = canvas.height = 64;
				const context = canvas.getContext('2d');
				setInterval(() => {
					context.fillStyle =
						'#' +
						Math.floor(Math.random() * 0xffffff)
							.toString(16)
							.padStart(6, '0');
					context.fillRect(0, 0, 64, 64);
				}, 50);
				const video = document.querySelector('video');
				video.muted = true;
				video.srcObject = canvas.captureStream(20);
				await video.play();
			};
			// YouTube can replace the <video> element while a video plays; this does the same.
			window.__swapVideo = async () => {
				const old = document.querySelector('#movie_player video');
				const next = document.createElement('video');
				next.muted = true;
				next.srcObject = old.srcObject;
				old.replaceWith(next);
				await next.play();
			};
			window.__pipResult = null;
			window.__tryPip = () => {
				document
					.querySelector('video')
					.requestPictureInPicture()
					.then(
						() => (window.__pipResult = 'started'),
						(error) => (window.__pipResult = error.name)
					);
			};
			// YouTube's mini-player: the same player element is moved into a small corner container.
			const pageChanged = () => document.dispatchEvent(new CustomEvent('yt-navigate-finish'));
			window.__miniplayer = () => {
				const player = document.getElementById('movie_player');
				const mini = document.createElement('ytd-miniplayer');
				mini.className = 'mini';
				mini.append(player);
				document.body.append(mini);
				history.pushState({}, '', '/');
				document.getElementById('slot').innerHTML = '<p>Home page</p>';
				pageChanged();
			};
			window.__expand = () => {
				const player = document.getElementById('movie_player');
				history.pushState({}, '', '/watch?v=test1');
				document.getElementById('slot').innerHTML =
					'<ytd-watch-flexy><div id="player"></div></ytd-watch-flexy>';
				document.getElementById('player').append(player);
				document.querySelector('ytd-miniplayer')?.remove();
				pageChanged();
			};
			window.__closeMini = () => {
				document.querySelector('ytd-miniplayer')?.remove();
				pageChanged();
			};
			window.__hideMini = () => {
				document.querySelector('ytd-miniplayer').style.display = 'none';
			};
			window.__addPlayer = () => {
				window.__noPlayer = false;
				render();
				pageChanged();
			};
			// A hover preview on the home page: a player that is not #movie_player.
			window.__showPreview = () => {
				const preview = document.createElement('ytd-video-preview');
				const player = document.createElement('div');
				player.id = 'inline-player';
				player.className = 'html5-video-player';
				player.getVideoData = () => ({
					video_id: 'previewvid1',
					title: 'A preview',
					author: 'Someone',
					isLive: false
				});
				player.getPlayerState = () => 1;
				player.getCurrentTime = () => 3;
				player.getDuration = () => 30;
				preview.append(player);
				document.body.append(preview);
			};
			window.__showError = () => {
				const player = document.getElementById('movie_player');
				const error = document.createElement('div');
				error.className = 'ytp-error';
				error.textContent = 'This video is unavailable';
				player.append(error);
			};
			window.__navigate = (path) => {
				history.pushState({}, '', path);
				render();
				document.dispatchEvent(new CustomEvent('yt-navigate-finish'));
			};
			render();
			// A link with a start time, as Resume opens, starts playing there by itself, like YouTube.
			const startAt = new URLSearchParams(location.search).get('t');
			if (startAt) {
				window.__position ??= Number(startAt.replace('s', '')) || 0;
				if (!window.__noAutoplay) window.__startVideo();
			}
		</script>
	</body>
</html>
